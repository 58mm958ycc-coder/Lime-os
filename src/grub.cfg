# Enable video modules inside the bootloader system
insmod vbe
insmod vga
insmod video_bochs
insmod video_cirrus

# Configure the canvas resolution parameters (matching your C++ screen sizing constants)
set gfxmode=1024x768x32
set gfxpayload=keep

menuentry "Lime OS (Unified Store System)" {
	multiboot /boot/limeos.bin
	boot
}
